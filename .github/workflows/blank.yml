name: Auto Build Caddy with Naive

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ======== 阶段 1：检查是否有代码更新 ========
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Check latest versions of Caddy and NaiveProxy
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 获取 Caddy 最新 Release 的 Tag (例如 v2.7.6)
          CADDY_LATEST=$(curl -s https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)
          
          # 2. 获取 forwardproxy naive 分支的最新 Commit Hash 的前 7 位
          NAIVE_HASH=$(curl -s https://api.github.com/repos/klzgrad/forwardproxy/commits/naive | jq -r .sha | cut -c1-7)
          
          # 3. 组合成我们自己的版本号，如：v2.7.6-naive-a1b2c3d
          NEW_TAG="${CADDY_LATEST}-naive-${NAIVE_HASH}"
          echo "Generated Release Tag: $NEW_TAG"
          
          # 4. 检查我们的仓库中是否已经有了这个版本的 Release
          if gh release view "$NEW_TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "✅ 当前版本 $NEW_TAG 已构建过，跳过本次编译。"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "🚀 发现上游有新版本 $NEW_TAG，准备开始编译！"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "release_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          fi

  # ======== 阶段 2：执行编译 (仅在发现更新时运行) ========
  build:
    needs: check-updates
    if: needs.check-updates.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Cache Go build and mod
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-

      # 【新增】安装跨平台瘦身工具（用于精简 ARM64 二进制文件）
      - name: Install cross-platform strip tools
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build and Strip Caddy for AMD64
        run: |
          echo "Building for AMD64..."
          GOOS=linux GOARCH=amd64 ~/go/bin/xcaddy build \
            --with github.com/mholt/caddy-l4 \
            --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive
          mv caddy caddy-linux-amd64
          
          # 【优化】编译完成后，剥离 AMD64 文件的符号表以减小体积
          strip caddy-linux-amd64

      - name: Build and Strip Caddy for ARM64
        run: |
          echo "Building for ARM64..."
          GOOS=linux GOARCH=arm64 ~/go/bin/xcaddy build \
            --with github.com/mholt/caddy-l4 \
            --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive
          mv caddy caddy-linux-arm64
          
          # 【优化】使用跨平台工具剥离 ARM64 文件的符号表以减小体积
          aarch64-linux-gnu-strip caddy-linux-arm64

      # 发布新的 Release，使用阶段 1 自动生成的优雅版本号
      - name: Release both versions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-updates.outputs.release_tag }}
          name: Caddy Build ${{ needs.check-updates.outputs.release_tag }}
          files: |
            caddy-linux-amd64
            caddy-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 6
