name: Auto Build Caddy with Naive

# 触发条件：支持手动触发，或者每周日凌晨 2 点自动运行
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 【优化】防止异常挂起，消耗免费时长

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'  # 【优化】始终使用最新稳定版 Go，提升编译性能
          cache: false

      # 【优化】手动缓存 Go 编译产物和依赖模块，大幅提升后续构建速度
      - name: Cache Go build and mod
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      # 【优化】合并步骤，并注入 GOFLAGS 压缩二进制文件体积
      - name: Build Caddy (AMD64 & ARM64)
        run: |
          # -s -w 用于去除调试信息和符号表，减小约 25% 的文件体积
          export GOFLAGS="-ldflags='-s -w'"
          
          echo "Building for AMD64..."
          GOOS=linux GOARCH=amd64 ~/go/bin/xcaddy build \
            --with github.com/mholt/caddy-l4 \
            --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive
          mv caddy caddy-linux-amd64

          echo "Building for ARM64..."
          GOOS=linux GOARCH=arm64 ~/go/bin/xcaddy build \
            --with github.com/mholt/caddy-l4 \
            --with github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@naive
          mv caddy caddy-linux-arm64

      # 根据当前时间生成动态的版本号标签
      - name: Generate Release Tag
        id: tag
        run: echo "RELEASE_TAG=v$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

      # 发布新的 Release
      - name: Release both versions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Caddy Build ${{ env.RELEASE_TAG }}
          files: |
            caddy-linux-amd64
            caddy-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 清理旧的 Releases (最多保留 10 个)
      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 清理旧的 Action Workflow 运行记录 (最多保留 6 个)
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 6
